[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarge"
version = "1.0.0"
description = "Schema-grounded event-table generation for Chinese financial document-level event extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jiakai Tong" },
    { name = "Mengting Qin" },
    { name = "Yongqi Hu" },
    { name = "Xueyao Wan" },
    { name = "Yue Zhao" },
]
keywords = ["dee", "event-extraction", "chinese-finance", "schema-grounded"]

dependencies = [
    "jsonschema>=4.20.0",
    "PyYAML>=6.0.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
server = [
    "torch>=2.2",
    "transformers>=4.51.0",
    "peft>=0.11.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sarge*"]
